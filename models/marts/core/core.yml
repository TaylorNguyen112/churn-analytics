version: 2

models:

  # ==================== DIMENSIONS ====================

  - name: dim_customer
    description: |
      SCD Type 1 customer dimension. One row per customer + one Unknown
      member. Customer attributes are stable in the current data;
      migrating to SCD Type 2 would be a schema-preserving change.
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: is_unknown_member
        data_tests:
          - not_null

  - name: dim_geography
    description: |
      Geography dimension keyed on ZIP code. State and region are NULL
      because no source provides them.
    columns:
      - name: geography_key
        data_tests:
          - not_null
          - unique
      - name: zip_code
        data_tests:
          - not_null
          - unique

  - name: dim_service_profile
    description: |
      Service configuration dimension. `service_profile_key` is a
      deterministic hash of the 14 natural service attributes; the same
      expression is used in the intermediate model so facts pick up the
      key directly.
    columns:
      - name: service_profile_key
        data_tests:
          - not_null
          - unique

  - name: dim_churn_reason
    description: |
      Churn reason dimension. Contains all observed (category, reason)
      pairs plus two special members:
        - `Not Applicable` for non-churned customer rows.
        - `Unknown` for churned rows missing a category or reason.
    columns:
      - name: churn_reason_key
        data_tests:
          - not_null
          - unique
      - name: member_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Real', 'Not Applicable', 'Unknown']

  - name: dim_date
    description: |
      Calendar dimension covering 2024-01-01 through 2026-12-31.
      `date_key` is integer YYYYMMDD; join facts on this key.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
      - name: calendar_date
        data_tests:
          - not_null
          - unique

  # ==================== FACTS ====================

  - name: fct_customer_monthly_snapshot
    description: |
      One row per (customer, snapshot_month). Incremental with Delta
      MERGE keyed on `customer_monthly_snapshot_key`. Watermark = max of
      (source_updated_at, ingested_at) with a 2-day lookback to absorb
      late-arriving updates.
    columns:
      - name: customer_monthly_snapshot_key
        data_tests:
          - not_null
          - unique
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: service_profile_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service_profile')
                field: service_profile_key
      - name: churn_reason_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_churn_reason')
                field: churn_reason_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_id
        data_tests:
          - not_null
      - name: snapshot_month
        data_tests:
          - not_null
      - name: customer_count
        data_tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: eligible_customer_count
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: churned_customer_count
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: monthly_revenue_lost
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                where: "monthly_revenue_lost is not null"

  - name: fct_support_event
    description: |
      One row per support_event_id. Incremental with Delta MERGE keyed
      on `support_event_key`. Descriptive event attributes remain on the
      fact by design.
    columns:
      - name: support_event_key
        data_tests:
          - not_null
          - unique
      - name: support_event_id
        data_tests:
          - not_null
          - unique
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: event_count
        data_tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: satisfaction_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
              config:
                where: "satisfaction_score is not null"
      - name: resolution_hours
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                where: "resolution_hours is not null"
