version: 2

models:

  - name: dim_customer
    description: |
      SCD Type 1 customer dimension. One row per customer + one Unknown
      member. Customer attributes are stable in the current data;
      migrating to SCD Type 2 would be a schema-preserving change.
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: is_unknown_member
        data_tests:
          - not_null

  - name: dim_geography
    description: |
      Geography dimension keyed on ZIP code. State and region are NULL
      because no source provides them.
    columns:
      - name: geography_key
        data_tests:
          - not_null
          - unique
      - name: zip_code
        data_tests:
          - not_null
          - unique

  - name: dim_service_profile
    description: |
      Service configuration dimension. `service_profile_key` is a
      deterministic hash of the 14 natural service attributes; the same
      expression is used in the intermediate model so facts pick up the
      key directly.
    columns:
      - name: service_profile_key
        data_tests:
          - not_null
          - unique

  - name: dim_churn_reason
    description: |
      Churn reason dimension. Contains all observed (category, reason)
      pairs plus two special members:
        - `Not Applicable` for non-churned customer rows.
        - `Unknown` for churned rows missing a category or reason.
    columns:
      - name: churn_reason_key
        data_tests:
          - not_null
          - unique
      - name: member_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Real', 'Not Applicable', 'Unknown']

  - name: dim_date
    description: |
      Calendar dimension covering 2024-01-01 through 2026-12-31.
      `date_key` is integer YYYYMMDD; join facts on this key.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
      - name: calendar_date
        data_tests:
          - not_null
          - unique
