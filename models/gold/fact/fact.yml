version: 2

models:

  - name: fct_customer_monthly_snapshot
    description: |
      One row per (customer, snapshot_month). Incremental with Delta
      MERGE keyed on `customer_monthly_snapshot_key`. Watermark =
      source_updated_at with a 2-day lookback to absorb late-arriving
      updates.
    columns:
      - name: customer_monthly_snapshot_key
        data_tests:
          - not_null
          - unique
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: service_profile_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service_profile')
                field: service_profile_key
      - name: churn_reason_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_churn_reason')
                field: churn_reason_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_id
        data_tests:
          - not_null
      - name: snapshot_month
        data_tests:
          - not_null
      - name: customer_count
        data_tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: eligible_customer_count
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: churned_customer_count
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: monthly_revenue_lost
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                where: "monthly_revenue_lost is not null"

  - name: fct_support_event
    description: |
      One row per support_event_id. Incremental with Delta MERGE keyed
      on `support_event_key`. Descriptive event attributes remain on the
      fact by design.
    columns:
      - name: support_event_key
        data_tests:
          - not_null
          - unique
      - name: support_event_id
        data_tests:
          - not_null
          - unique
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: event_count
        data_tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: satisfaction_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
              config:
                where: "satisfaction_score is not null"
      - name: resolution_hours
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                where: "resolution_hours is not null"
