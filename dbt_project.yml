name: 'churn_analytics'
version: '1.0.0'
config-version: 2

profile: 'local_databricks_cluster'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Medallion layout in the `workspace` catalog:
#   bronze              (raw sources, external)
#   silver/staging      (clean, deduped, typed)
#   silver/intermediate (reusable business entities)
#   gold/dim            (conformed dimensions)
#   gold/fact           (star-schema facts, incremental)
#
# Catalog is set outside dbt_project.yml (local profile / task Warehouse
# catalog). Schema routing is authoritative here via `+schema: silver`
# and `+schema: gold`; macros/generate_schema_name.sql maps these values
# directly (no `<target>_silver` suffixing).
models:
  churn_analytics:
    silver:
      +schema: silver
      +materialized: view
      staging:
        +tags: ["silver", "staging"]
      intermediate:
        +tags: ["silver", "intermediate"]
    gold:
      +schema: gold
      dim:
        +materialized: table
        +tags: ["gold", "dim"]
      fact:
        # Fact models set materialized='incremental' inline (unique_key
        # differs per fact, so a folder default would be misleading).
        +tags: ["gold", "fact"]
