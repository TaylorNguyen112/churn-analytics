name: 'churn_analytics'
version: '1.0.0'
config-version: 2

profile: 'local_databricks_cluster'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Medallion layout in the `workspace` catalog:
#   bronze  (sources)   -> silver (staging + intermediate) -> gold (marts)
#
# Catalog is set outside dbt_project.yml:
#   - Locally: profiles.yml `catalog: workspace`.
#   - Databricks task: task-level "Warehouse catalog" field.
#
# Schema routing is authoritative here via `+schema: silver` and
# `+schema: gold`, so per-model layer placement is independent of any
# task's "Warehouse schema" default. macros/generate_schema_name.sql
# maps these values directly (no `<target>_silver` suffix).
models:
  churn_analytics:
    staging:
      +materialized: view
      +schema: silver
      +tags: ["silver", "staging"]
    intermediate:
      +materialized: view
      +schema: silver
      +tags: ["silver", "intermediate"]
    marts:
      +schema: gold
      core:
        +materialized: table
        +tags: ["gold", "core"]
