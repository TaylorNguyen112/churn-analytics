# dbt profile for the churn_analytics project.
# Secrets are read from environment variables so this file is safe to commit.
# See .env.example for the variables to set.
# Docs: https://docs.getdbt.com/docs/core/connect-data-platform/databricks-setup

churn_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DBT_DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_DATABRICKS_CLIENT_SECRET') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DBT_SILVER_SCHEMA', 'silver') }}"
      threads: 4
