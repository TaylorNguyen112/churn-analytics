name: Cleanup PR CI schema

on:
  pull_request:
    types: [closed]

concurrency:
  group: dbt-pr-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:

  cleanup:
    name: Drop CI schema
    # Never run against forked PRs — no credentials for the CI service
    # principal are exposed to them anyway, and the schema was never
    # created for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci

    env:
      DBT_DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ vars.DBT_DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_CLIENT_ID: ${{ secrets.DBT_DATABRICKS_CLIENT_ID }}
      DBT_DATABRICKS_CLIENT_SECRET: ${{ secrets.DBT_DATABRICKS_CLIENT_SECRET }}
      DBT_CATALOG: ${{ vars.DBT_CATALOG }}
      APPROVED_CI_CATALOG: ${{ vars.APPROVED_CI_CATALOG }}
      APPROVED_CI_PREFIX_REGEX: ${{ vars.APPROVED_CI_PREFIX_REGEX }}
      DBT_CI_SCHEMA_PREFIX: ci_pr_${{ github.event.pull_request.number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: bash scripts/ci/install_dependencies.sh

      - name: Drop CI schemas
        run: bash scripts/cleanup/drop_ci_schema.sh
